version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/offlineapi/migrations"
    queries: "internal/offlineapi/queries"
    gen:
      go:
        package: "db"
        out: "internal/offlineapi/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true

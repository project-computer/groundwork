version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        # Keep golangci-lint's staticcheck defaults (doc-comment ST checks off)
        # and disable QF1008: the embedded selector in models/common.go Null*
        # helpers is intentional for clarity when wrapping sql.Null* types.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -QF1008
  exclusions:
    rules:
      # Deferred cleanup calls (rows.Close, tx.Rollback, file closes): the
      # error is not actionable at that point; handling it would add noise.
      - linters: [errcheck]
        source: '^\s*defer '

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install JS deps
        run: |
          pnpm -C apps/clinic install --frozen-lockfile
          pnpm -C apps/landing install --frozen-lockfile

      - name: Lint (TS)
        run: make lint-ts lint-landing

      - name: Tests (TS)
        run: make test-ts test-landing

      - name: Lint (Go)
        run: make lint-go

      - name: Go vulnerability scan
        run: make vuln-go

      - name: Go tests
        run: make test-go

      - name: Lint (Rust)
        run: make lint-rust

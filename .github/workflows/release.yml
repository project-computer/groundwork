# Cross-platform desktop builds for the Tauri shell (apps/clinic).
#
# Builds the Go clinic-core sidecar, bundles it via `bundle.externalBin`,
# and produces signed-off installers for the three desktop OSes:
#
#   macOS  (macos-latest, Apple Silicon)   .app/.dmg   — unsigned
#   Windows (windows-latest)               .msi/.exe   — NSIS + WiX, unsigned
#   Linux  (ubuntu-latest, currently 26.04) .deb/.rpm/.AppImage
#
# Triggered by pushed `v*` tags (draft GitHub release with bundle assets)
# or manually (artifacts-only). The `make`/Go toolchain requirements come
# from build.beforeBuildCommand in tauri.conf.json, which stages the
# sidecar via the Makefile before every `tauri build`.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-latest # 26.04 LTS
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/clinic/pnpm-lock.yaml

      # The Makefile stages both the sidecar (apps/sidecar) and vetcare
      # (server) binaries, so cache both modules.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/sidecar/go.mod
          cache-dependency-path: |
            apps/sidecar/go.sum
            server/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/clinic/src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install make (Windows)
        # The Makefile drives the sidecar build; windows-latest ships without make.
        # Git Bash provides the `bash`/`cp` the Makefile's `SHELL := bash` assumes.
        if: runner.os == 'Windows'
        run: |
          choco install make --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\bin"

      - name: Install JS deps
        run: pnpm -C apps/clinic install --frozen-lockfile

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/clinic
          # Empty on workflow_dispatch → skip release creation, artifacts only.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Vet Clinic v__VERSION__"
          releaseDraft: true
          prerelease: false

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: vet-clinic-${{ matrix.platform }}
          path: apps/clinic/src-tauri/target/release/bundle/**
          if-no-files-found: error

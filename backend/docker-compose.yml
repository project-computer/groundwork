version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vet_postgres
    environment:
      POSTGRES_USER: vetuser
      POSTGRES_PASSWORD: vetpass
      POSTGRES_DB: vetclinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetuser -d vetclinic"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vet_api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://vetuser:vetpass@postgres:5432/vetclinic?sslmode=disable
      JWT_SECRET: dev-secret-key-change-in-production
      PORT: 8080
      CORS_ORIGINS: http://localhost:5173
      ENV: development
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

# Development database for the cloud API (backend/).
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   cd backend && cp .env.example .env 2>/dev/null; export DATABASE_URL=postgres://postgres:vet@localhost:5432/vet?sslmode=disable
#   psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000001_init_schema.up.sql  # ...or use a migrate tool
#   psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/seed.sql

services:
  postgres:
    image: postgres:16
    container_name: vet-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vet
      POSTGRES_DB: vet
    ports:
      - "5432:5432"
    volumes:
      - vet-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vet-dev-pgdata:
